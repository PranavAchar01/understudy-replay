[project]
name = "understudy"
version = "0.1.0"
description = "Runway-generated human demonstrations turned into gated SO-101 training data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.3",
  "numpy",
  "opencv-python-headless",
  "pillow",
  "torch",
  "lerobot[dataset,smolvla]==0.6.1",
  "pytest",
  "fastapi>=0.141.1",
  "uvicorn>=0.53.0",
]

[project.optional-dependencies]
# Second-engine cross-check of the replays (src/understudy/crosscheck.py). Optional: the pipeline runs without it.
# On macOS 15 PyPI's pybullet sdist does not compile; scripts/build_pybullet.sh builds a patched wheel.
crosscheck = ["pybullet==3.2.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=data/work/pytest -p no:warnings -q"
